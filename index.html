<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>影视前期提示词生成器</title>
<meta name="app-version" content="1.0.20">
<link rel="stylesheet" href="assets/style.css?v=54">
<link rel="stylesheet" href="assets/vendor/nouislider/nouislider.min.css">
  <link rel="stylesheet" href="assets/vendor/tom-select/tom-select.css">
<link rel="stylesheet" href="assets/theme-light.css">
<link rel="stylesheet" href="assets/theme-mecha.css?v=4">
  <link rel="stylesheet" href="assets/theme-blackboard.css">
  <link rel="stylesheet" href="assets/theme-cyber.css?v=2">
  <link rel="stylesheet" href="assets/theme-guofeng.css?v=1">
</head>
<body>
<div id="bg3d"></div>
<div id="app">
  <!-- 顶栏：两行布局（第一行功能入口 / 第二行品牌+模型信息） -->
  <header class="topbar">
    <div class="tb-row tb-row-1">
      <div class="tb-left">
        <button id="btnHist" class="icon-btn" title="历史作品">📚<span class="tb-lab">历史</span></button>
      </div>
      <div class="tb-right">
        <button id="btnAiLog" class="icon-btn" title="AI 请求日志">🗒️<span class="tb-lab">日志</span></button>
        <button id="btnTheme" class="icon-btn" title="切换界面主题">🎨<span class="tb-lab">主题</span></button>
        <button id="btnSettings" class="icon-btn" title="设置">☰<span class="tb-lab">选项</span></button>
      </div>
    </div>
    <div class="tb-row tb-row-2">
      <div class="brand">
        <span class="logo">🎬</span>
        <span class="title">影视前期提示词生成器</span>
      </div>
      <button id="cfgBadge" class="cfg-badge" title="当前模型：点击切换">AI · 未选</button>
    </div>
  </header>

  <!-- 历史作品弹层（点击 📚 展开；复用 spec-panel 样式保证跨主题一致） -->
  <div id="histPanel" class="spec-panel hidden">
    <div class="spec-head">
      <span>📚 历史作品</span>
      <span class="spec-actions">
        <button id="btnImportFyp" class="hist-new-btn" type="button">📥 导入 .fyp</button>
        <button id="histNewLong" class="hist-new-btn" type="button">＋ 新建长篇</button>
        <button id="btnNewProject" class="hist-new-btn" type="button">＋ 新建小说</button>
        <input type="file" id="fypImportInput" accept=".fyp,application/json" style="display:none">
      </span>
    </div>
    <div class="hist-list" id="histList"></div>
  </div>

  <!-- 主题弹层（点击 🎨 展开；复用 spec-panel 样式保证跨主题一致） -->
  <div id="themePanel" class="spec-panel hidden">
    <div class="spec-head">
      <span>🎨 界面主题</span>
      <span class="spec-note">实时切换，无需换页</span>
    </div>
    <div class="theme-btns" id="themeBtns">
      <button type="button" class="btn theme" data-theme="dark">🌙 默认深色</button>
      <button type="button" class="btn theme" data-theme="light">☀️ 白天</button>
      <button type="button" class="btn theme" data-theme="blackboard">🎮 3D 黑板</button>
      <button type="button" class="btn theme" data-theme="mecha">🦾 机甲科幻</button>
      <button type="button" class="btn theme" data-theme="cyber">🕹️ 赛博朋克</button>
      <button type="button" class="btn theme" data-theme="guofeng">🏮 古风国潮</button>
    </div>
    <!-- v10.16 分任务温度（从设置弹窗移入主题面板；id 不变、功能零影响） -->
    <hr class="tp-sep">
    <div class="set-block">
      <div class="set-block-head"><span>🌡️ 分任务温度（留空用建议值）</span></div>
      <label class="field"><span>全局（未细分任务）</span>
        <input id="cfgTemp" type="number" step="0.1" min="0" max="1" placeholder="0.7"></label>
      <label class="field"><span>生成大纲（发散，建议 0.7）</span>
        <input id="cfgTempOutline" type="number" step="0.1" min="0" max="1" placeholder="0.7"></label>
      <label class="field"><span>优化构想（折中，建议 0.5）</span>
        <input id="cfgTempIdea" type="number" step="0.1" min="0" max="1" placeholder="0.5"></label>
      <label class="field"><span>标题 AI（折中，建议 0.5）</span>
        <input id="cfgTempTitle" type="number" step="0.1" min="0" max="1" placeholder="0.5"></label>
      <label class="field"><span>生成梗概（忠实偏稳，建议 0.4）</span>
        <input id="cfgTempPlan" type="number" step="0.1" min="0" max="1" placeholder="0.4"></label>
      <label class="field"><span>生成章节（折中，建议 0.5）</span>
        <input id="cfgTempChapter" type="number" step="0.1" min="0" max="1" placeholder="0.5"></label>
      <label class="field"><span>质检/提取（严谨，建议 0.2）</span>
        <input id="cfgTempQC" type="number" step="0.1" min="0" max="1" placeholder="0.2"></label>
      <div class="tp-save-row"><button id="btnTempSave" class="btn small primary" type="button">💾 保存温度</button></div>
      <p class="hint">改后点「保存温度」生效；各 AI 请求按任务类型取对应温度（大纲 0.7 / 优化构想 0.5 / 标题 0.5 / 梗概 0.4 / 章节 0.5 / 质检 0.2）。</p>
    </div>
  </div>

  <!-- 步骤指示 -->
  <nav id="stepper" class="stepper"></nav>

  <!-- 机甲主题专用顶部胶囊导航 -->
  <nav id="mechaTopNav" class="mecha-top-nav">
    <button class="cap" data-step="1">故事构想</button>
    <button class="cap" data-step="2">角色提示词</button>
    <button class="cap" data-step="3">场景提示词</button>
    <button class="cap" data-step="4">分镜文字</button>
    <button class="cap" data-export>导出资产包</button>
  </nav>

  <!-- 主内容 -->
  <main id="view" class="view"></main>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button class="tab" data-step="1"><span>📖</span>故事</button>
    <button class="tab" data-step="2"><span>🧑</span>角色</button>
    <button class="tab" data-step="3"><span>🏞️</span>场景</button>
    <button class="tab" data-step="4"><span>🎞️</span>分镜</button>
    <button class="tab" data-step="5"><span>📦</span>导出</button>
  </nav>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h3>AI 模型配置</h3>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="modal-body">
      <!-- 第一段：服务列表 -->
      <div class="set-block">
        <div class="set-block-head">
          <span>服务商 / 账号组</span>
          <button id="btnAddGroup" class="btn small ghost" type="button">＋ 新增组</button>
        </div>
        <div id="groupsList" class="groups-list"></div>
      </div>

      <!-- 第二段：组详情 -->
      <div id="groupDetail" class="set-block"></div>

      <!-- 第三段：当前生成使用（三级联动，来源唯一） -->
      <div class="set-block">
        <div class="set-block-head"><span>当前生成使用（仅向这一个 AI 发请求，绝不并发多个）</span></div>
        <label class="field">
          <span>服务组</span>
          <select id="c_selGroup"></select>
        </label>
        <label class="field">
          <span>账号（API Key）</span>
          <select id="c_selKey"></select>
        </label>
        <label class="field">
          <span>模型</span>
          <select id="c_selModel"></select>
        </label>
      </div>
      <p class="hint">API Key 仅存本机浏览器，不会上传任何第三方；生成时只使用上方所选的账号与模型，避免多个 AI 并发导致费用激增。</p>

      <div class="modal-actions">
        <button id="btnCfgTest" class="btn ghost">测试连接</button>
        <button id="btnCfgSave" class="btn primary">保存</button>
      </div>
      <p id="cfgStatus" class="status"></p>
    </div>
  </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast hidden"></div>

<!-- 启动加载遮罩（首次 await 读取 IndexedDB，毫秒级后自动隐藏） -->
<div id="bootLoading" class="boot-loading hidden"><div class="boot-loading-inner">加载中…</div></div>

<!-- 沉浸式章节阅读浮层：点侧边空白 / ✕ / ESC 退出 -->
<div id="readerOverlay" class="reader hidden">
  <div class="reader-backdrop" data-reader-close></div>
  <div class="reader-panel">
    <div class="reader-head">
      <div class="reader-title" id="readerTitle"></div>
      <div class="reader-actions">
        <button class="icon-btn reader-toc-btn" id="readerTocBtn" title="章节目录">☰</button>
        <button class="icon-btn reader-close" data-reader-close title="退出阅读">✕</button>
      </div>
    </div>
    <div class="reader-body" id="readerBody"></div>
    <!-- 底部中央「概」按钮：点击显示本章梗概（fixed8） -->
    <button class="reader-syn-btn" id="readerSynBtn" type="button" title="本章梗概" aria-label="本章梗概">概</button>
    <!-- 本章梗概浮层：正方形，宽度=阅读界面一半（fixed8） -->
    <div class="reader-syn-pop hidden" id="readerSynPop">
      <div class="reader-syn-card" id="readerSynCard"></div>
    </div>
    <!-- 章节目录抽屉：100+ 章快速跳转 -->
    <div class="reader-toc hidden" id="readerToc">
      <div class="toc-head">
        <span>目录（<b id="tocCount"></b> 章）</span>
        <button class="icon-btn" id="tocClose" title="收起">✕</button>
      </div>
      <div class="toc-list" id="tocList"></div>
    </div>
  </div>
</div>

<script src="assets/vendor/nouislider/nouislider.min.js"></script>
  <script src="assets/vendor/tom-select/tom-select.complete.min.js"></script>
<script src="assets/vendor/jszip.min.js"></script>
<script src="assets/idb.js?v=2"></script>
<script src="assets/app.js?v=76"></script>
</body>
</html>
